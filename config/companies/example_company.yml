# config/companies/example_company.yml — annotated template
# Copy this file to config/companies/<yourcompany>.yml and fill in your details.
# All files in config/companies/ are gitignored except this template.

company: Example Corp                # display name (used in email drafts)
domain: AI infrastructure            # 1-3 words describing the space; used in cover letter template
apply_method: outreach               # ats | outreach | both

roles:
  - title: Staff Software Engineer, Platform
    url: https://example.com/careers/job-id-here
    priority: 1                      # lower = higher priority
    resume: <ABSOLUTE_PATH_TO_RESUME.pdf>

  - title: Senior Staff Engineer, ML Infrastructure
    url: https://example.com/careers/job-id-here-2
    priority: 2
    resume: <ABSOLUTE_PATH_TO_RESUME.pdf>

# ─── ATS config (only needed when apply_method includes ats) ─────────────────
ats:
  system: greenhouse                 # greenhouse | lever | workday | google_careers | custom
  login_url: https://example.com/login
  login_field_email: <YOUR_EMAIL>
  # Tip: store your password in macOS Keychain or a password manager.
  # The agent will prompt for manual login on first run, then reuse the session cookie.

# ─── Outreach config ─────────────────────────────────────────────────────────
# Overrides the generic why_company template from standard_answers.yml.
# Supports [COMPANY], [ROLE], [DOMAIN], [SPECIFIC_PRODUCT] placeholders.
why_company_override: >
  I am drawn to [COMPANY] because of its work in [DOMAIN]. Having built
  [YOUR_RELEVANT_EXPERIENCE], this is the natural next challenge.

# ─── Browser agent hints ─────────────────────────────────────────────────────
bot_detection_risk: low              # low | medium | high
  # high = reCAPTCHA or aggressive bot detection; may require human assist on first run
session_cookie_file: ~/.job-copilot/sessions/example_company.pkl
  # Pickle file where session cookies are stored after first manual login
